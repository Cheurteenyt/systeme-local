version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # uv.lock is NOT regenerated by Dependabot for pip bumps; the
    # .github/workflows/dependabot-post-update.yml workflow regenerates it
    # with the CI-pinned uv==0.11.29 so the "Check lock" CI step stays green.
    versioning-strategy: increase
    labels:
      - "dependencies"
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "security"
