version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    # uv.lock is NOT regenerated by Dependabot for pip bumps; the
    # .github/workflows/dependabot-post-update.yml workflow regenerates it.
    # The uv version itself is tracked in .uv-version (not pinned in CI) so
    # Dependabot can bump it via the "uv" ecosystem below without breaking
    # the "Check lock" / audit CI steps.
    versioning-strategy: increase
    labels:
      - "dependencies"
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "security"
