name: evidence governance

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

concurrency:
  group: evidence-governance
  cancel-in-progress: false

jobs:
  evidence-governance:
    name: evidence governance
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned dependency manager
        run: python -m pip install --disable-pip-version-check "uv==$(cat .uv-version)"

      - name: Sync frozen runtime
        run: uv sync --frozen --python python

      - name: Evaluate C3 capability evidence lifecycle
        run: >-
          uv run --frozen
          python -m systeme_local_gateway.c3_evidence
          governance
          --github-annotations

      - name: Verify derived C4 runtime admission remains denied
        run: >-
          uv run --frozen
          python -m systeme_local_gateway.c4_admission
          matrix
          --root .
          --c3-registry governance/c3-capability-registry.json
          --c4-registry governance/c4-runtime-adapters.json
          --expect-all-denied

      - name: Acquire current official capability evidence without promotion
        run: >-
          uv run --frozen
          python -m systeme_local_gateway.c6_revalidation
          acquire
          --root .
          --policy governance/c6-revalidation-policy.json
          --c3-registry governance/c3-capability-registry.json
          --github-annotations
          --expect-all-denied

      - name: Verify historical C6 official revalidation seal
        run: >-
          uv run --frozen
          python -m systeme_local_gateway.c6_seal
          --root .
          verify

      - name: Verify C7 Work pre-live admission remains zero effect
        run: >-
          uv run --frozen
          python -m systeme_local_gateway.c7_work_admission
          status

      - name: Verify historical C7 Work pre-live admission seal
        run: >-
          uv run --frozen
          python -m systeme_local_gateway.c7_seal
          verify

      - name: Verify C5 squash integration tree and ancestry
        run: >-
          uv run --frozen
          python -m systeme_local_gateway.c5_integration
          verify
          --root .
          --require-clean

      - name: Check current evidence dates
        run: python scripts/check_evidence_governance.py --fail-within-days 7
