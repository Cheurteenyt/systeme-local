name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-bootstrap.txt

      - name: Install pinned dependency manager
        run: UV_VERSION=$(cat .uv-version) && python -m pip install --disable-pip-version-check "uv==$UV_VERSION"

      - name: Sync frozen environment
        run: uv sync --frozen --extra dev --python python

      - name: Check lock
        run: uv lock --check

      - name: Lint
        run: uv run --frozen --extra dev ruff check .

      - name: Check formatting ratchet
        env:
          SLG_FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SLG_FORMAT_HEAD: ${{ github.sha }}
        run: >-
          uv run --frozen --extra dev
          python scripts/check_python_format.py
          --base "$SLG_FORMAT_BASE"
          --head "$SLG_FORMAT_HEAD"

      - name: Check typing ratchet
        env:
          SLG_TYPING_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SLG_TYPING_HEAD: ${{ github.sha }}
        run: >-
          uv run --frozen --extra dev
          python scripts/check_python_typing.py
          --base "$SLG_TYPING_BASE"
          --head "$SLG_TYPING_HEAD"

      - name: Check Markdown links
        run: uv run --frozen --extra dev python scripts/check_markdown_links.py

      - name: Check deterministic evidence governance
        run: >-
          uv run --frozen --extra dev
          python scripts/check_evidence_governance.py
          --as-of 2026-07-26T20:00:00Z
          --fail-within-days 0

      - name: Check C3 capability evidence lifecycle
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c3_evidence
          governance
          --as-of 2026-08-10T12:00:00Z
          --github-annotations

      - name: Check C4 runtime admission remains fail closed
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c4_admission
          matrix
          --root .
          --c3-registry governance/c3-capability-registry.json
          --c4-registry governance/c4-runtime-adapters.json
          --as-of 2026-08-10T12:00:00Z
          --expect-all-denied

      - name: Check C5 squash integration tree and ancestry
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c5_integration
          verify
          --root .
          --require-clean

      - name: Check C6 official revalidation remains review only
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c6_revalidation
          verify
          --root .
          --policy governance/c6-revalidation-policy.json
          --c3-registry governance/c3-capability-registry.json
          --as-of 2026-07-27T15:00:00Z
          --expect-all-denied

      - name: Verify historical C6 official revalidation seal
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c6_seal
          --root .
          verify

      - name: Verify current C6 pull request tree matches its seal
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'codex/chatgpt-official-revalidation-c6'
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c6_seal
          --root .
          verify
          --require-current-tree

      - name: Check C7 Work pre-live admission remains zero effect
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c7_work_admission
          status
          --as-of 2026-07-27T16:00:00Z

      - name: Verify historical C7 Work pre-live admission seal
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c7_seal
          verify

      - name: Verify current C7 pull request tree matches its seal
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'codex/chatgpt-work-capability-c7'
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c7_seal
          verify
          --require-current-tree

      - name: Verify historical C8 Work live evidence seal
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c8_seal
          verify

      - name: Verify current C8 pull request tree matches its seal
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'codex/chatgpt-work-live-c8'
        run: >-
          uv run --frozen --extra dev
          python -m systeme_local_gateway.c8_seal
          verify
          --require-current-tree

      - name: Check C9 attachment handoff remains bounded offline
        run: >-
          uv run --frozen --extra dev
          python -m pytest -q
          tests/test_c9_*.py
          tests/test_mcp_rich_result.py

      - name: Check documentation contracts
        run: uv run --frozen --extra dev pytest -q tests/test_documentation_governance.py

      - name: Audit frozen Python dependencies
        run: >-
          uv run --frozen --extra dev
          python scripts/audit_python_dependencies.py

      - name: Test with coverage
        run: >-
          uv run --frozen --extra dev
          python -m pytest
          -k "not test_c7_historical_seal_verifies_tag_diff_manifest_and_tree"
          --cov=systeme_local_gateway
          --cov-report=term-missing
          --cov-fail-under=60

  compatibility:
    name: compatibility (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tools/requirements-bootstrap.txt

      - name: Install pinned dependency manager
        run: UV_VERSION=$(cat .uv-version) && python -m pip install --disable-pip-version-check "uv==$UV_VERSION"

      - name: Sync frozen environment
        run: uv sync --frozen --extra dev --python python

      - name: Run tests
        run: uv run --frozen --extra dev python -m pytest -q -k "not test_c7_historical_seal_verifies_tag_diff_manifest_and_tree"

  c9-windows-python:
    name: C9 Windows security and operator scripts
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-bootstrap.txt

      - name: Install pinned dependency manager
        run: $env:UV_VERSION = $(Get-Content .uv-version -Raw).Trim() ; python -m pip install --disable-pip-version-check "uv==$env:UV_VERSION"

      - name: Sync frozen environment
        run: uv sync --frozen --extra dev --python python

      - name: Install pinned PowerShell analyzer
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Install-PackageProvider `
              -Name NuGet `
              -MinimumVersion 2.8.5.201 `
              -Force | Out-Null
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module `
              -Name PSScriptAnalyzer `
              -RequiredVersion 1.25.0 `
              -Repository PSGallery `
              -Scope CurrentUser `
              -Force `
              -AllowClobber
          Import-Module PSScriptAnalyzer -RequiredVersion 1.25.0 -Force
          if ($null -eq (Get-Command Invoke-ScriptAnalyzer -ErrorAction SilentlyContinue)) {
            throw "Pinned PSScriptAnalyzer installation is unavailable."
          }

      - name: Exercise bounded C9 Windows security and scripts
        shell: powershell
        run: >-
          uv run --frozen --extra dev python -m pytest -q
          tests/test_c9_attachment_security.py
          tests/test_c9_git.py
          tests/test_c9_local_ai.py
          tests/test_c9_manual_export.py
          tests/test_c9_private_state.py
          tests/test_c9_scripts.py
          tests/test_c9_script_hardening.py

  rust-quality:
    name: rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt,clippy

      - name: Select Rust toolchain
        run: rustup override set 1.97.1

      - name: Check
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: >-
          cargo clippy
          --workspace
          --all-targets
          --all-features
          --locked
          --
          -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast

      - name: Check doctests
        run: cargo test --doc --workspace --all-features --locked

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc
          --workspace
          --all-features
          --no-deps
          --document-private-items
          --locked

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        run: cargo audit

  rust-windows:
    name: rust tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust 1.97.1
        run: >-
          rustup toolchain install 1.97.1
          --profile minimal
          --component rustfmt,clippy

      - name: Select Rust toolchain
        run: rustup override set 1.97.1

      - name: Check bundled PowerShell collector syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "crates/audit-watchdog/src/windows_snapshot.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if (@($errors).Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Exercise operator-evidence custodian protocol
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $requestPath = (
              Resolve-Path `
                  "tests/fixtures/operator_evidence_custodian/valid_request.ndjson"
          ).Path
          $responsePath = (
              Resolve-Path `
                  "tests/fixtures/operator_evidence_custodian/valid_response.ndjson"
          ).Path

          $strictUtf8 = [System.Text.UTF8Encoding]::new($false, $true)
          $requestBytes = [System.IO.File]::ReadAllBytes($requestPath)

          if (
              $requestBytes.Length -ge 3 -and
              $requestBytes[0] -eq 0xEF -and
              $requestBytes[1] -eq 0xBB -and
              $requestBytes[2] -eq 0xBF
          ) {
              throw "Custodian request fixture must not contain a UTF-8 BOM"
          }

          $requestText = $strictUtf8.GetString($requestBytes).Replace("`r`n", "`n")
          $requestWithoutTerminator = $requestText.TrimEnd([char[]]"`n")

          if (
              -not $requestText.EndsWith("`n", [StringComparison]::Ordinal) -or
              $requestWithoutTerminator.Contains("`n") -or
              $requestWithoutTerminator.Contains("`r") -or
              [string]::IsNullOrWhiteSpace($requestWithoutTerminator)
          ) {
              throw "Custodian request fixture must contain exactly one terminated message"
          }

          $expected = (
              [System.IO.File]::ReadAllText(
                  $responsePath,
                  $strictUtf8
              )
          ).Replace("`r`n", "`n")

          & cargo build `
              --quiet `
              --locked `
              --package systeme-local-operator-evidence-custodian

          if ($LASTEXITCODE -ne 0) {
              throw "Custodian protocol build failed"
          }

          $binary = (
              Resolve-Path `
                  "target/debug/systeme-local-operator-evidence-custodian.exe"
          ).Path

          $tempRoot = if (
              -not [string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)
          ) {
              $env:RUNNER_TEMP
          }
          else {
              [System.IO.Path]::GetTempPath()
          }

          $nonce = [guid]::NewGuid().ToString("N")
          $stdoutPath = Join-Path $tempRoot "custodian-$nonce.stdout"
          $stderrPath = Join-Path $tempRoot "custodian-$nonce.stderr"

          try {
              $process = Start-Process `
                  -FilePath $binary `
                  -WorkingDirectory (Get-Location).Path `
                  -NoNewWindow `
                  -Wait `
                  -PassThru `
                  -RedirectStandardInput $requestPath `
                  -RedirectStandardOutput $stdoutPath `
                  -RedirectStandardError $stderrPath

              $actualBytes = [System.IO.File]::ReadAllBytes($stdoutPath)
              $stderrBytes = [System.IO.File]::ReadAllBytes($stderrPath)
              $actual = $strictUtf8.GetString($actualBytes).Replace("`r`n", "`n")
              $stderr = $strictUtf8.GetString($stderrBytes)

              if ($process.ExitCode -ne 0) {
                  throw (
                      "Custodian protocol command failed: exit=" +
                      "$($process.ExitCode); stdout_base64=" +
                      [Convert]::ToBase64String($actualBytes) +
                      "; stderr_base64=" +
                      [Convert]::ToBase64String($stderrBytes)
                  )
              }

              if ($stderrBytes.Length -ne 0) {
                  throw (
                      "Custodian protocol emitted unexpected stderr_base64=" +
                      [Convert]::ToBase64String($stderrBytes)
                  )
              }

              if ($actual -cne $expected) {
                  throw (
                      "Custodian protocol response mismatch: actual_base64=" +
                      [Convert]::ToBase64String($actualBytes)
                  )
              }
          }
          finally {
              Remove-Item `
                  -LiteralPath $stdoutPath `
                  -Force `
                  -ErrorAction SilentlyContinue
              Remove-Item `
                  -LiteralPath $stderrPath `
                  -Force `
                  -ErrorAction SilentlyContinue
          }

      - name: Test
        run: cargo test --workspace --all-features --locked --no-fail-fast
