[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "systeme-local-agent-gateway"
version = "0.1.0"
description = "Secure capability gateway between remote AI agents and a local sandbox"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Système Local contributors" }]
dependencies = [
  "fastapi>=0.141.1,<1",
  "httpx>=0.28.1,<1",
  "mcp>=1.27.2,<2",
  "psutil>=7.2.2,<8",
  "pydantic>=2.13.4,<3",
  "pydantic-settings>=2.4,<3",
  "pywin32>=312,<313; sys_platform == 'win32'",
  "PyYAML>=6.0.3,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pip-audit==2.10.1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.3.0,<7",
  "ruff>=0.16.2,<1",
  "types-psutil>=7.2.2.20260518,<8",
  "uv==0.11.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/systeme_local_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a live Docker Engine and the sandbox image",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Rules intentionally not enforced for this governance/security codebase.
# They are style/opinion-based and add no safety value here; enforcing them
# would churn every module for zero runtime benefit.
ignore = [
  "TRY004", # raise X(msg) -> prefer TypeError: opinion, no safety gain
  "BLE001", # broad except Exception: legitimate at governance/operator boundaries
  "SIM117", # nested with: cosmetic only
  "PYI064", # *.pyi type-annotation style
  "RUF012", # ClassVar needed on typed class attrs: noise
  "B023", # lambda capture in loop: acceptable in fixtures/tests
  "DTZ001", # datetime.now() without tz: caller-controlled contexts
  "DTZ005", # datetime.now() in tests
  "S110", # try/except pass in test scaffolding
  "SIM102", # nested if: cosmetic
  "PLW0127", # self/cls assignment in __post_init__: intentional
  "PLR1704", # else after raise: cosmetic
  "UP017", # datetime.now(timezone.utc) -> datetime.now(UTC): the evidence
           # governance check requires the literal timezone.utc form
  "ISC004", # implicit string concatenation: cosmetic, no safety value
]

# The provider facade test (test_provider_canonicalization_compatibility)
# computes a SHA256 over the import-order-dependent __all__ and origin map.
# Import sorting (I001) would reshuffle that order and break the approved
# baseline, so it is disabled for the providers package on purpose.
[tool.ruff.lint.per-file-ignores]
# The provider facade canonicalization test computes a SHA256 over the
# import-order-dependent __all__ and origin map, and over the literal __all__
# list order. Any ruff rule that reshuffles imports/__all__/symbol order
# (I001, RUF022) or rewrites provider source in ways that change the facade
# baseline (UP037 asyncio modernization, RUF100 noqa, UP035/UP012 typing
# style) would break the approved baseline, so they are disabled for the
# providers package on purpose. S608 is suppressed here because the flagged
# string building is API/URL construction, not SQL execution.
"src/systeme_local_gateway/providers/**" = ["I001", "RUF022", "UP037", "RUF100", "UP035", "UP012", "S608"]
[tool.mypy]
python_version = "3.11"
cache_dir = ".systeme-local/mypy-cache"
plugins = ["pydantic.mypy"]
files = [
  "scripts",
  "src/systeme_local_gateway/c0_attest.py",
  "src/systeme_local_gateway/c0_probe.py",
  "src/systeme_local_gateway/c0_proof_check.py",
  "src/systeme_local_gateway/c0_smoke.py",
  "src/systeme_local_gateway/c0_tunnel_smoke.py",
  "src/systeme_local_gateway/c1_attest.py",
  "src/systeme_local_gateway/c1_evidence.py",
  "src/systeme_local_gateway/c1_observability.py",
  "src/systeme_local_gateway/c1_proof_check.py",
  "src/systeme_local_gateway/c2_capability.py",
  "src/systeme_local_gateway/c3_evidence.py",
  "src/systeme_local_gateway/c4_admission.py",
  "src/systeme_local_gateway/c5_integration.py",
  "src/systeme_local_gateway/c6_revalidation.py",
  "src/systeme_local_gateway/c6_seal.py",
  "src/systeme_local_gateway/c7_seal.py",
  "src/systeme_local_gateway/c7_work_admission.py",
  "src/systeme_local_gateway/c8_governance.py",
  "src/systeme_local_gateway/c8_live_cycle.py",
  "src/systeme_local_gateway/c8_proof_check.py",
  "src/systeme_local_gateway/c8_seal.py",
  "src/systeme_local_gateway/c9_attachment_security.py",
  "src/systeme_local_gateway/c9_attestation.py",
  "src/systeme_local_gateway/c9_control.py",
  "src/systeme_local_gateway/c9_control_api.py",
  "src/systeme_local_gateway/c9_git.py",
  "src/systeme_local_gateway/c9_handoff_runtime.py",
  "src/systeme_local_gateway/c9_live_cycle.py",
  "src/systeme_local_gateway/c9_local_ai.py",
  "src/systeme_local_gateway/c9_manual_export.py",
  "src/systeme_local_gateway/c9_mcp_tool.py",
  "src/systeme_local_gateway/c9_private_state.py",
  "src/systeme_local_gateway/c9_seal.py",
  "src/systeme_local_gateway/c9_synthetic_fixtures.py",
  "src/systeme_local_gateway/c9_work_bridge.py",
  "src/systeme_local_gateway/config.py",
  "src/systeme_local_gateway/executor.py",
  "src/systeme_local_gateway/main.py",
  "src/systeme_local_gateway/mcp_runtime.py",
  "src/systeme_local_gateway/mcp_tools.py",
  "src/systeme_local_gateway/providers/_canonicalization.py",
  "src/systeme_local_gateway/providers/_operator_evidence",
  "src/systeme_local_gateway/providers/chatgpt_mcp_live_probe.py",
  "src/systeme_local_gateway/providers/mcp_deployment_models.py",
  "src/systeme_local_gateway/providers/mcp_operator_evidence_models.py",
  "src/systeme_local_gateway/providers/mcp_readiness_models.py",
  "src/systeme_local_gateway/providers/models.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.uv]
required-version = "0.11.29"
