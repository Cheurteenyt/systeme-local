[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "systeme-local-agent-gateway"
version = "0.1.0"
description = "Secure capability gateway between remote AI agents and a local sandbox"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Système Local contributors" }]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "mcp>=1.27.2,<2",
  "psutil>=6.1,<8",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pywin32>=312,<313; sys_platform == 'win32'",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.20.2",
  "pip-audit==2.10.1",
  "pytest>=9.0.3,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "types-psutil>=6.1,<8",
  "uv==0.12.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/systeme_local_gateway"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires a live Docker Engine and the sandbox image",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
cache_dir = ".systeme-local/mypy-cache"
plugins = ["pydantic.mypy"]
files = [
  "scripts",
  "src/systeme_local_gateway/c0_attest.py",
  "src/systeme_local_gateway/c0_probe.py",
  "src/systeme_local_gateway/c0_proof_check.py",
  "src/systeme_local_gateway/c0_smoke.py",
  "src/systeme_local_gateway/c0_tunnel_smoke.py",
  "src/systeme_local_gateway/c1_attest.py",
  "src/systeme_local_gateway/c1_evidence.py",
  "src/systeme_local_gateway/c1_observability.py",
  "src/systeme_local_gateway/c1_proof_check.py",
  "src/systeme_local_gateway/c2_capability.py",
  "src/systeme_local_gateway/c3_evidence.py",
  "src/systeme_local_gateway/c4_admission.py",
  "src/systeme_local_gateway/c5_integration.py",
  "src/systeme_local_gateway/c6_revalidation.py",
  "src/systeme_local_gateway/c6_seal.py",
  "src/systeme_local_gateway/c7_seal.py",
  "src/systeme_local_gateway/c7_work_admission.py",
  "src/systeme_local_gateway/c8_governance.py",
  "src/systeme_local_gateway/c8_live_cycle.py",
  "src/systeme_local_gateway/c8_proof_check.py",
  "src/systeme_local_gateway/c8_seal.py",
  "src/systeme_local_gateway/c9_attachment_security.py",
  "src/systeme_local_gateway/c9_attestation.py",
  "src/systeme_local_gateway/c9_control.py",
  "src/systeme_local_gateway/c9_control_api.py",
  "src/systeme_local_gateway/c9_git.py",
  "src/systeme_local_gateway/c9_handoff_runtime.py",
  "src/systeme_local_gateway/c9_live_cycle.py",
  "src/systeme_local_gateway/c9_local_ai.py",
  "src/systeme_local_gateway/c9_manual_export.py",
  "src/systeme_local_gateway/c9_mcp_tool.py",
  "src/systeme_local_gateway/c9_private_state.py",
  "src/systeme_local_gateway/c9_seal.py",
  "src/systeme_local_gateway/c9_synthetic_fixtures.py",
  "src/systeme_local_gateway/c9_work_bridge.py",
  "src/systeme_local_gateway/config.py",
  "src/systeme_local_gateway/executor.py",
  "src/systeme_local_gateway/main.py",
  "src/systeme_local_gateway/mcp_runtime.py",
  "src/systeme_local_gateway/mcp_tools.py",
  "src/systeme_local_gateway/providers/_canonicalization.py",
  "src/systeme_local_gateway/providers/_operator_evidence",
  "src/systeme_local_gateway/providers/chatgpt_mcp_live_probe.py",
  "src/systeme_local_gateway/providers/mcp_deployment_models.py",
  "src/systeme_local_gateway/providers/mcp_operator_evidence_models.py",
  "src/systeme_local_gateway/providers/mcp_readiness_models.py",
  "src/systeme_local_gateway/providers/models.py",
]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.uv]
required-version = "0.11.29"
